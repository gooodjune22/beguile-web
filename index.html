<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- 모바일: 기기 폭, 확대 금지, 노치 영역까지 쓰고(viewport-fit=cover) 안전 영역은 아래 CSS로 비운다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- 아이폰 '홈 화면에 추가'로 열면 주소창 없이 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Beguile">
    <meta name="theme-color" content="#0e1116">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="TemplateData/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="TemplateData/icons/apple-touch-icon-180.png">
    <title>Beguile</title>
    <style>
      /* 페이지 스크롤/당기기 새로고침/길게 눌러 선택/두 번 탭 확대 막기 */
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #0e1116; overflow: hidden; overscroll-behavior: none;
        position: fixed; inset: 0;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; touch-action: none;
        font-family: -apple-system, Helvetica, Arial, sans-serif; color: #cfd6de;
      }
      /* 안전 영역(노치, 홈 표시줄) 안쪽에만 게임을 그린다 */
      #wrap {
        position: fixed;
        left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
        top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
        display: flex; align-items: center; justify-content: center;
      }
      #unity-canvas { display: block; background: #0e1116; touch-action: none; outline: none; }
      #status {
        position: fixed; left: 50%; top: 45%; transform: translateX(-50%); white-space: nowrap; font-size: 18px; pointer-events: none;
      }
      #status.error { top: 10px; left: 0; transform: none; width: 100%; box-sizing: border-box; color: #fff; background: #a32; padding: 8px; font-size: 14px; white-space: pre-wrap; }
      /* 로딩 중과 시작 뒤 몇 초 동안 버전 표시 (조작을 막지 않음) */
      #version {
        position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); transform: translateX(-50%); white-space: nowrap;
        font-size: 12px; color: #cfd6de; background: rgba(14, 17, 22, 0.85); border-radius: 6px; padding: 2px 8px; pointer-events: none;
      }
      /* 새 버전 / 오프라인 준비 안내 */
      #toast {
        position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 72px); transform: translateX(-50%);
        display: none; align-items: center; gap: 10px; width: max-content; max-width: 92vw; box-sizing: border-box; word-break: keep-all;
        background: #202833; color: #e8edf2; border: 1px solid #4a5666; border-radius: 8px; padding: 8px 12px; font-size: 14px; touch-action: manipulation;
      }
      #toast button { font: inherit; border: 0; border-radius: 6px; padding: 8px 12px; background: #f2c94c; color: #10141a; white-space: nowrap; }
      #toast button.plain { background: transparent; color: #cfd6de; padding: 8px 4px; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="status">Loading...</div>
    <div id="version"></div>
    <div id="toast"></div>
    <script>
      // 버전 = 시각-커밋. tools/deploy_web.ps1이 채운다 (채우지 않은 개발용 빌드는 "dev": 서비스 워커를 쓰지 않음)
      window.BEGUILE_VERSION = "20261125-143327-1c210bb";
      if (window.BEGUILE_VERSION.indexOf("__") === 0) window.BEGUILE_VERSION = "dev";
    </script>
    <script src="TemplateData/beguile-pwa.js"></script>
    <script>
      // 쿼리: ?dpr=1 (선명도 비교: 표준 DPI로 강제), ?debug=1, ?autoplay=1, ?seed=N, ?level=N (Bootstrap이 읽음), ?nosw=1 (서비스 워커 끄기, beguile-pwa.js)
      var query = new URLSearchParams(location.search);
      var canvas = document.querySelector("#unity-canvas");
      var wrap = document.querySelector("#wrap");
      var statusEl = document.querySelector("#status");
      window.beguileStatus = "loading";

      function showError(msg) {
        window.beguileStatus = "error: " + msg;
        statusEl.className = "error";
        statusEl.textContent = msg;
        statusEl.style.display = "block";
        console.error("[beguile-page] " + msg);
      }
      window.addEventListener("error", function (e) { showError("JS error: " + e.message); });
      window.addEventListener("unhandledrejection", function (e) { showError("Promise error: " + (e.reason && e.reason.message || e.reason)); });

      // 캔버스 크기: 안전 영역을 꽉 채우되 너무 넓으면(가로 화면, PC) 가운데 세로 기둥(최대 3:4)으로.
      // 게임 화면은 Expand 스케일러라 어떤 비율에서도 깨지지 않는다. 내부 해상도 = CSS 크기 x devicePixelRatio (Unity가 맞춤).
      var MAX_ASPECT = 3 / 4;
      function layout() {
        var w = wrap.clientWidth, h = wrap.clientHeight;
        var cw = Math.min(w, Math.floor(h * MAX_ASPECT));
        canvas.style.width = cw + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", layout);
      window.addEventListener("orientationchange", function () { setTimeout(layout, 200); });
      layout();

      // iOS Safari: 핀치 확대 제스처와 두 번 탭 확대 막기
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });

      var buildUrl = "Build";
      // 버전을 주소에 붙여 브라우저/CDN이 다른 버전의 파일을 섞어 주지 않게 한다
      var v = window.BEGUILE_VERSION === "dev" ? "" : "?v=" + window.BEGUILE_VERSION;
      var loaderUrl = buildUrl + "/WebGL.loader.js" + v;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data" + v,
        frameworkUrl: buildUrl + "/WebGL.framework.js" + v,
        codeUrl: buildUrl + "/WebGL.wasm" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Beguile",
        productVersion: "1.0",
        // 선명도: 내부 해상도 배율. 공식 문서상 기본(미설정)도 브라우저 devicePixelRatio이지만, 명시해서 ?dpr=1과 비교할 수 있게 한다.
        devicePixelRatio: query.has("dpr") ? parseFloat(query.get("dpr")) : (window.devicePixelRatio || 1),
        // 기록 저장(Application.persistentDataPath)을 브라우저 저장소(IndexedDB)에 자동 반영 -> 새로고침 뒤에도 남는다
        autoSyncPersistentDataPath: true,
        showBanner: function (msg, type) {
          if (type === "error") showError(msg); else console.warn("[unity-banner] " + msg);
        },
      };
      window.beguileDpr = config.devicePixelRatio;

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = function () { showError("Cannot load " + loaderUrl); };
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          if (progress < 1) statusEl.textContent = "Loading " + Math.round(progress * 100) + "%";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          window.beguileStatus = "running";
          statusEl.style.display = "none";
          if (window.beguileAfterLoad) window.beguileAfterLoad();   // 버전 표시 숨김 예약, 서비스 워커 등록
          // 탭을 떠날 때(백그라운드, 닫기) 진행 중인 판을 저장 (OnApplicationPause는 웹에서 믿을 수 없음)
          // "Beguile" = Main 씬의 Bootstrap 오브젝트 이름 (SceneBuilder)
          function hidden() { try { unityInstance.SendMessage("Beguile", "OnWebPageHidden"); } catch (e) { } }
          document.addEventListener("visibilitychange", function () { if (document.hidden) hidden(); });
          window.addEventListener("pagehide", hidden);
        }).catch(function (message) { showError(String(message)); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
